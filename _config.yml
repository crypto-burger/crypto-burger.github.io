title: Crypto Burger
description: "오늘의 메뉴: 블록체인 🍔"
remote_theme: mmistakes/so-simple-theme@3.2.0
locale: ko-KR
date_format: "%Y-%m-%d"
permalink: /:year/:month/:day/:title/
markdown: kramdown
timezone: Asia/Seoul

# Google Search Console 소유권 확인 (jekyll-seo-tag가 메타 태그로 출력)
webmaster_verifications:
  google: "ID4mj2acHxdp1Rq79DrARa0SiZNWRDPE6xmfkk0zi08"

exclude:
  - CLAUDE.md
  - AGENTS.md
  - docs/
  - scripts/
  - README.md
  - CONTRIBUTING.md
  - vendor/
  - .bundle/
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: atom.xml

google_fonts:
  - name: "Noto Sans KR"
    weights: "400,700"

footer_links:
  - title: Feed
    url: atom.xml
    icon: fas fa-rss-square
