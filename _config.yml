title: Crypto Burger
description: "블록체인 기초부터 스테이블코인까지, 회차별 스터디 정리와 미니 프로젝트를 함께 기록하는 블로그"
remote_theme: mmistakes/so-simple-theme@3.2.0
locale: ko-KR
date_format: "%Y-%m-%d"
permalink: /:year/:month/:day/:title/
markdown: kramdown
timezone: Asia/Seoul

exclude:
  - CLAUDE.md
  - AGENTS.md
  - docs/
  - scripts/
  - README.md
  - CONTRIBUTING.md
  - vendor/
  - .bundle/
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: atom.xml

google_fonts:
  - name: "Noto Sans KR"
    weights: "400,700"

footer_links:
  - title: Feed
    url: atom.xml
    icon: fas fa-rss-square
